# Prompts de apoyo para la Práctica 12
# El slug del laboratorio debe ser: lab12

tarea1:
  title: "Explicar la Tarea 1 con IA"
  prompt: >-
    Explícame expertamente qué hice en la Tarea 1 de la
    Práctica 12 de Couchbase Server.

    Validé que la colección contuviera 200 000 documentos y documenté
    cuatro escenarios reproducibles para escritura intensiva, carga
    progresiva, consulta selectiva y agregación temporal mediante SQL++.

    Explica el propósito de cada comando, configuración o procedimiento,
    cómo interpretar las salidas esperadas, cómo validar que la tarea se
    completó correctamente y qué errores comunes podrían presentarse.

tarea2:
  title: "Explicar la Tarea 2 con IA"
  prompt: >-
    Explícame expertamente qué hice en la Tarea 2 de la
    Práctica 12 de Couchbase Server.

    Creé un motor KV multihilo y ejecuté el escenario write-heavy con
    16 workers, 20% GET y 80% UPSERT, midiendo operaciones por segundo,
    errores y percentiles p50, p95 y p99.

    Explica el propósito de cada comando, configuración o procedimiento,
    cómo interpretar las salidas esperadas, cómo validar que la tarea se
    completó correctamente y qué errores comunes podrían presentarse.

tarea3:
  title: "Explicar la Tarea 3 con IA"
  prompt: >-
    Explícame expertamente qué hice en la Tarea 3 de la
    Práctica 12 de Couchbase Server.

    Ejecuté la misma carga mixta 70% GET y 30% UPSERT con 4, 8, 16
    y 32 workers, conservando throughput, p95, p99 y tasa de errores
    para construir una curva comparable de concurrencia.

    Explica el propósito de cada comando, configuración o procedimiento,
    cómo interpretar las salidas esperadas, cómo validar que la tarea se
    completó correctamente y qué errores comunes podrían presentarse.

tarea4:
  title: "Explicar la Tarea 4 con IA"
  prompt: >-
    Explícame expertamente qué hice en la Tarea 4 de la
    Práctica 12 de Couchbase Server.

    Analicé los niveles consecutivos de carga comparando ganancia de
    throughput y crecimiento de p95 para identificar un candidato de
    saturación mediante la regla pedagógica definida en el laboratorio.

    Explica el propósito de cada comando, configuración o procedimiento,
    cómo interpretar las salidas esperadas, cómo validar que la tarea se
    completó correctamente y qué errores comunes podrían presentarse.

tarea5:
  title: "Explicar la Tarea 5 con IA"
  prompt: >-
    Explícame expertamente qué hice en la Tarea 5 de la
    Práctica 12 de Couchbase Server.

    Creé un primary index temporal y capturé un baseline SQL++ mediante
    EXPLAIN, PROFILE y un benchmark de 20 ejecuciones, verificando que
    el plan utilizara PrimaryScan antes de aplicar optimizaciones.

    Explica el propósito de cada comando, configuración o procedimiento,
    cómo interpretar las salidas esperadas, cómo validar que la tarea se
    completó correctamente y qué errores comunes podrían presentarse.

tarea6:
  title: "Explicar la Tarea 6 con IA"
  prompt: >-
    Explícame expertamente qué hice en la Tarea 6 de la
    Práctica 12 de Couchbase Server.

    Creé el secondary index idx_created_type_value con réplica, esperé
