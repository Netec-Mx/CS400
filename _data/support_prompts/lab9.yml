    Explica el propósito de cada comando, configuración o procedimiento,
    cómo interpretar las salidas esperadas, cómo validar que la tarea se
    completó correctamente y qué errores comunes podrían presentarse.

tarea9:
  title: "Explicar la Tarea 9 con IA"
  prompt: >-
    Explícame expertamente qué hice en la Tarea 9 de la
    Práctica 9 de Couchbase Server.

    Construí un runbook de Disaster Recovery utilizando los tiempos
    medidos de graceful, hard, auto-failover y DR, separando mantenimiento,
    fallo de nodo y desastre completo del sitio primario.

    Explica el propósito de cada comando, configuración o procedimiento,
    cómo interpretar las salidas esperadas, cómo validar que la tarea se
    completó correctamente y qué errores comunes podrían presentarse.

tarea10:
  title: "Explicar la Tarea 10 con IA"
  prompt: >-
    Explícame expertamente qué hice en la Tarea 10 de la
    Práctica 9 de Couchbase Server.

    Reactivé la replicación DR, ejecuté una validación integral de zonas,
    Server Groups, health, vBuckets, XDCR, filtering, RPO y RTO y
    consolidé todas las evidencias principales en un reporte final.

    Explica el propósito de cada comando, configuración o procedimiento,
    cómo interpretar las salidas esperadas, cómo validar que la tarea se
    completó correctamente y qué errores comunes podrían presentarse.