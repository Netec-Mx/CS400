# Prompts de apoyo para la Práctica 5
# El slug del laboratorio debe ser: lab5

tarea1:
  title: "Explicar la Tarea 1 con IA"
  prompt: >-
    Explícame expertamente qué hice en la Tarea 1 de la
    Práctica 5 de Couchbase Server.

    Validé Search, Eventing y Analytics dentro de la topología MDS,
    comprobé sus listeners especializados y creé una collection bilingüe
    controlada con documentos y coordenadas conocidas para las pruebas FTS.

    Explica el propósito de cada comando, configuración o procedimiento,
    cómo interpretar las salidas esperadas, cómo validar que la tarea se
    completó correctamente y qué errores comunes podrían presentarse.

tarea2:
  title: "Explicar la Tarea 2 con IA"
  prompt: >-
    Explícame expertamente qué hice en la Tarea 2 de la
    Práctica 5 de Couchbase Server.

    Creé un índice Full-Text Search scoped con mappings estáticos,
    analyzers en inglés y español, campos keyword y geopoint, y esperé
    hasta confirmar que los documentos del corpus fueran indexados.

    Explica el propósito de cada comando, configuración o procedimiento,
    cómo interpretar las salidas esperadas, cómo validar que la tarea se
    completó correctamente y qué errores comunes podrían presentarse.

tarea3:
  title: "Explicar la Tarea 3 con IA"
  prompt: >-
    Explícame expertamente qué hice en la Tarea 3 de la
    Práctica 5 de Couchbase Server.

    Ejecuté consultas Search de tipo match, fuzzy, boolean y geo para
    comprobar analyzers lingüísticos, tolerancia ortográfica, filtros
    exactos y búsquedas por distancia utilizando el mismo índice FTS.

    Explica el propósito de cada comando, configuración o procedimiento,
    cómo interpretar las salidas esperadas, cómo validar que la tarea se
    completó correctamente y qué errores comunes podrían presentarse.

tarea4:
  title: "Explicar la Tarea 4 con IA"
  prompt: >-
    Explícame expertamente qué hice en la Tarea 4 de la
    Práctica 5 de Couchbase Server.

    Creé el bucket lab5-eventing y las collections bookings,
    bookings_enriched y eventing_metadata, e inserté cinco reservas
    históricas antes de desplegar la función Eventing.

    Explica el propósito de cada comando, configuración o procedimiento,
    cómo interpretar las salidas esperadas, cómo validar que la tarea se
    completó correctamente y qué errores comunes podrían presentarse.

tarea5:
  title: "Explicar la Tarea 5 con IA"
  prompt: >-
    Explícame expertamente qué hice en la Tarea 5 de la
    Práctica 5 de Couchbase Server.

    Creé y desplegué una función Eventing scoped con from_now que valida
    reservas, calcula duración y costo, clasifica la estancia y mantiene
    documentos derivados en una collection destino.

    Explica el propósito de cada comando, configuración o procedimiento,
    cómo interpretar las salidas esperadas, cómo validar que la tarea se
    completó correctamente y qué errores comunes podrían presentarse.

tarea6:
