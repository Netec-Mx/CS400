# Prompts de apoyo para la Práctica 11
# El slug del laboratorio debe ser: lab11

tarea1:
  title: "Explicar la Tarea 1 con IA"
  prompt: >-
    Explícame expertamente qué hice en la Tarea 1 de la
    Práctica 11 de Couchbase Server.

    Validé el endpoint Prometheus nativo de Couchbase, recolecté métricas
    de todos los Pods, construí un catálogo por servicio y comprobé un
    contrato mínimo de métricas Query e Index antes de usar PromQL.

    Explica el propósito de cada comando, configuración o procedimiento,
    cómo interpretar las salidas esperadas, cómo validar que la tarea se
    completó correctamente y qué errores comunes podrían presentarse.

tarea2:
  title: "Explicar la Tarea 2 con IA"
  prompt: >-
    Explícame expertamente qué hice en la Tarea 2 de la
    Práctica 11 de Couchbase Server.

    Configuré Services y ServiceMonitor para Couchbase Server y Operator,
    incorporé autenticación Basic Auth para /metrics y validé que
    Prometheus cargara los jobs y mantuviera sus targets en estado UP.

    Explica el propósito de cada comando, configuración o procedimiento,
    cómo interpretar las salidas esperadas, cómo validar que la tarea se
    completó correctamente y qué errores comunes podrían presentarse.

tarea3:
  title: "Explicar la Tarea 3 con IA"
  prompt: >-
    Explícame expertamente qué hice en la Tarea 3 de la
    Práctica 11 de Couchbase Server.

    Creé un cliente Python, inicié un workload continuo de operaciones KV
    y SQL++, registré métricas periódicas de rendimiento y preparé una
    captura de baseline de al menos cinco minutos.

    Explica el propósito de cada comando, configuración o procedimiento,
    cómo interpretar las salidas esperadas, cómo validar que la tarea se
    completó correctamente y qué errores comunes podrían presentarse.

tarea4:
  title: "Explicar la Tarea 4 con IA"
  prompt: >-
    Explícame expertamente qué hice en la Tarea 4 de la
    Práctica 11 de Couchbase Server.

    Descubrí el datasource Prometheus de Grafana y generé mediante Python
    un dashboard reproducible con cinco filas para Cluster Overview,
    Data, Query/Index, servicios avanzados y Kubernetes/Operator.

    Explica el propósito de cada comando, configuración o procedimiento,
    cómo interpretar las salidas esperadas, cómo validar que la tarea se
    completó correctamente y qué errores comunes podrían presentarse.

tarea5:
  title: "Explicar la Tarea 5 con IA"
  prompt: >-
    Explícame expertamente qué hice en la Tarea 5 de la
    Práctica 11 de Couchbase Server.

