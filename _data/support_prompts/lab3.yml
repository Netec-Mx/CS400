    Explica el propósito de cada comando, configuración o procedimiento,
    cómo interpretar las salidas esperadas, cómo validar que la tarea se
    completó correctamente y qué errores comunes podrían presentarse.

tarea10:
  title: "Explicar la Tarea 10 con IA"
  prompt: >-
    Explícame expertamente qué hice en la Tarea 10 de la
    Práctica 3 de Couchbase Server.

    Ejecuté la validación final del laboratorio, eliminé la collection
    route_lab3 y el Pod cliente temporal, y confirmé que planes, perfiles,
    benchmarks y demás evidencias permanecieran almacenados localmente.

    Explica el propósito de cada comando, configuración o procedimiento,
    cómo interpretar las salidas esperadas, cómo validar que la tarea se
    completó correctamente y qué errores comunes podrían presentarse.