# Prompts de apoyo para la Práctica 6
# El slug del laboratorio debe ser: lab6

tarea1:
  title: "Explicar la Tarea 1 con IA"
  prompt: >-
    Explícame expertamente qué hice en la Tarea 1 de la
    Práctica 6 de Couchbase Server.

    Capturé una línea base de seguridad revisando Services Kubernetes,
    exposición externa, configuración inicial de transporte, usuarios
    RBAC existentes y una matriz de postura previa al hardening.

    Explica el propósito de cada comando, configuración o procedimiento,
    cómo interpretar las salidas esperadas, cómo validar que la tarea se
    completó correctamente y qué errores comunes podrían presentarse.

tarea2:
  title: "Explicar la Tarea 2 con IA"
  prompt: >-
    Explícame expertamente qué hice en la Tarea 2 de la
    Práctica 6 de Couchbase Server.

    Creé una collection aislada, grupos y usuarios RBAC granulares y
    validé mediante SDK y SQL++ permisos de lectura KV, SELECT,
    escritura y administración de índices bajo menor privilegio.

    Explica el propósito de cada comando, configuración o procedimiento,
    cómo interpretar las salidas esperadas, cómo validar que la tarea se
    completó correctamente y qué errores comunes podrían presentarse.

tarea3:
  title: "Explicar la Tarea 3 con IA"
  prompt: >-
    Explícame expertamente qué hice en la Tarea 3 de la
    Práctica 6 de Couchbase Server.

    Creé una CA privada y certificados X.509 para Couchbase Server y
    Couchbase Operator, validé SAN, usos, cadena y fingerprints y los
    almacené como Kubernetes Secrets de tipo TLS.

    Explica el propósito de cada comando, configuración o procedimiento,
    cómo interpretar las salidas esperadas, cómo validar que la tarea se
    completó correctamente y qué errores comunes podrían presentarse.

tarea4:
