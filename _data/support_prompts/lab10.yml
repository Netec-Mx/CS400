# Prompts de apoyo para la Práctica 10
# El slug del laboratorio debe ser: lab10

tarea1:
  title: "Explicar la Tarea 1 con IA"
  prompt: >-
    Explícame expertamente qué hice en la Tarea 1 de la
    Práctica 10 de Couchbase Server.

    Inspeccioné Couchbase Kubernetes Operator, Admission Controller,
    CRDs y webhooks, utilicé kubectl explain para revisar el schema
    declarativo y capturé logs iniciales como baseline administrativo.

    Explica el propósito de cada comando, configuración o procedimiento,
    cómo interpretar las salidas esperadas, cómo validar que la tarea se
    completó correctamente y qué errores comunes podrían presentarse.

tarea2:
  title: "Explicar la Tarea 2 con IA"
  prompt: >-
    Explícame expertamente qué hice en la Tarea 2 de la
    Práctica 10 de Couchbase Server.

    Validé la StorageClass gp3, el EBS CSI Driver y las Availability
    Zones del clúster, relacionando WaitForFirstConsumer con el
    aprovisionamiento y afinidad zonal de volúmenes persistentes.

    Explica el propósito de cada comando, configuración o procedimiento,
    cómo interpretar las salidas esperadas, cómo validar que la tarea se
    completó correctamente y qué errores comunes podrían presentarse.

tarea3:
  title: "Explicar la Tarea 3 con IA"
  prompt: >-
    Explícame expertamente qué hice en la Tarea 3 de la
    Práctica 10 de Couchbase Server.

    Desplegué un CouchbaseCluster Enterprise 7.6.2 con dos Data Pods,
    un Query + Index, almacenamiento gp3 y un CouchbaseBucket declarativo,
    validando cuotas, Pods, PVC, PV y helpers de descubrimiento.

    Explica el propósito de cada comando, configuración o procedimiento,
    cómo interpretar las salidas esperadas, cómo validar que la tarea se
    completó correctamente y qué errores comunes podrían presentarse.

tarea4:
  title: "Explicar la Tarea 4 con IA"
  prompt: >-
    Explícame expertamente qué hice en la Tarea 4 de la
    Práctica 10 de Couchbase Server.

    Comparé el desired state definido en el Custom Resource con el estado
    real de Kubernetes y Couchbase, utilizando Pods, UID, nodos,
    status.conditions, membership, servicios y rebalanceStatus.

    Explica el propósito de cada comando, configuración o procedimiento,
    cómo interpretar las salidas esperadas, cómo validar que la tarea se
    completó correctamente y qué errores comunes podrían presentarse.

tarea5:
  title: "Explicar la Tarea 5 con IA"
  prompt: >-
    Explícame expertamente qué hice en la Tarea 5 de la
    Práctica 10 de Couchbase Server.

    Modifiqué únicamente el desired state de la server class Data de
    dos a tres miembros, observé la divergencia temporal y validé cómo
    Operator creó el nuevo Pod, PVC y completó el rebalance.

    Explica el propósito de cada comando, configuración o procedimiento,
    cómo interpretar las salidas esperadas, cómo validar que la tarea se
    completó correctamente y qué errores comunes podrían presentarse.

tarea6:
  title: "Explicar la Tarea 6 con IA"
  prompt: >-
    Explícame expertamente qué hice en la Tarea 6 de la
    Práctica 10 de Couchbase Server.

    Inserté un documento con durabilidad, eliminé un Data Pod sin cambiar
    la cardinalidad declarada y comprobé que Operator recuperó la instancia,
    reutilizó el PVC y mantuvo disponible el documento de prueba.

    Explica el propósito de cada comando, configuración o procedimiento,
    cómo interpretar las salidas esperadas, cómo validar que la tarea se
    completó correctamente y qué errores comunes podrían presentarse.

tarea7:
  title: "Explicar la Tarea 7 con IA"
  prompt: >-
    Explícame expertamente qué hice en la Tarea 7 de la
    Práctica 10 de Couchbase Server.

    Actualicé declarativamente memoryQuota de lab-bucket de 512Mi a
    768Mi y comparé el valor almacenado en CouchbaseBucket.spec con
    la cuota efectiva reportada por la REST API de Couchbase.

    Explica el propósito de cada comando, configuración o procedimiento,
    cómo interpretar las salidas esperadas, cómo validar que la tarea se
    completó correctamente y qué errores comunes podrían presentarse.

tarea8:
  title: "Explicar la Tarea 8 con IA"
  prompt: >-
    Explícame expertamente qué hice en la Tarea 8 de la
    Práctica 10 de Couchbase Server.

    Generé fallos independientes en validación, scheduling y container
    runtime y analicé status.conditions y logs del Operator para construir
    un diagnóstico por capas sin mezclar síntomas de distintos problemas.

    Explica el propósito de cada comando, configuración o procedimiento,
    cómo interpretar las salidas esperadas, cómo validar que la tarea se
    completó correctamente y qué errores comunes podrían presentarse.

tarea9:
  title: "Explicar la Tarea 9 con IA"
  prompt: >-
    Explícame expertamente qué hice en la Tarea 9 de la
    Práctica 10 de Couchbase Server.

    Construí una matriz de reconciliación relacionando desired state,
    Kubernetes state y Couchbase state para baseline, scale-out,
    pérdida de Pod, recovery y actualización declarativa del bucket.

    Explica el propósito de cada comando, configuración o procedimiento,
    cómo interpretar las salidas esperadas, cómo validar que la tarea se
    completó correctamente y qué errores comunes podrían presentarse.

tarea10:
  title: "Explicar la Tarea 10 con IA"
  prompt: >-
    Explícame expertamente qué hice en la Tarea 10 de la
    Práctica 10 de Couchbase Server.

    Ejecuté una validación integral de disponibilidad, cardinalidad,
    health, rebalance, cuota y persistencia y consolidé desired state,
    Kubernetes state, Couchbase state y recovery en un dossier final.

    Explica el propósito de cada comando, configuración o procedimiento,
    cómo interpretar las salidas esperadas, cómo validar que la tarea se
    completó correctamente y qué errores comunes podrían presentarse.