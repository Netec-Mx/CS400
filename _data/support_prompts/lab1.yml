# Prompts de apoyo para la Práctica 1
# El slug del laboratorio debe ser: lab1

tarea1:
  title: "Explicar la Tarea 1 con IA"
  prompt: >-
    Explícame expertamente qué hice en la Tarea 1 de la
    Práctica 1 de Couchbase Server.

    Validé AWS CLI, eksctl, kubectl, Helm y jq; comprobé la identidad
    activa en AWS y definí las variables reutilizables del laboratorio
    para EKS y Couchbase.

    Explica el propósito de cada comando, configuración o procedimiento,
    cómo interpretar las salidas esperadas, cómo validar que la tarea se
    completó correctamente y qué errores comunes podrían presentarse.

tarea2:
  title: "Explicar la Tarea 2 con IA"
  prompt: >-
    Explícame expertamente qué hice en la Tarea 2 de la
    Práctica 1 de Couchbase Server.

    Preparé y validé el script eks-cluster.sh utilizado para crear y
    eliminar Amazon EKS, y analicé los componentes de infraestructura
    que eksctl aprovisionará mediante AWS.

    Explica el propósito de cada comando, configuración o procedimiento,
    cómo interpretar las salidas esperadas, cómo validar que la tarea se
    completó correctamente y qué errores comunes podrían presentarse.

tarea3:
  title: "Explicar la Tarea 3 con IA"
  prompt: >-
    Explícame expertamente qué hice en la Tarea 3 de la
    Práctica 1 de Couchbase Server.

    Creé el clúster Amazon EKS, comprobé sus tres nodos administrados
    y validé que el Amazon EBS CSI Driver estuviera activo y disponible
    para atender solicitudes de almacenamiento persistente.

    Explica el propósito de cada comando, configuración o procedimiento,
    cómo interpretar las salidas esperadas, cómo validar que la tarea se
    completó correctamente y qué errores comunes podrían presentarse.

tarea4:
  title: "Explicar la Tarea 4 con IA"
  prompt: >-
    Explícame expertamente qué hice en la Tarea 4 de la
    Práctica 1 de Couchbase Server.

    Creé una StorageClass basada en Amazon EBS gp3 con
    WaitForFirstConsumer e instalé Couchbase Kubernetes Operator y
    Admission Controller mediante Helm sin crear el clúster predeterminado.

    Explica el propósito de cada comando, configuración o procedimiento,
    cómo interpretar las salidas esperadas, cómo validar que la tarea se
    completó correctamente y qué errores comunes podrían presentarse.

tarea5:
  title: "Explicar la Tarea 5 con IA"
  prompt: >-
    Explícame expertamente qué hice en la Tarea 5 de la
    Práctica 1 de Couchbase Server.

    Creé el secreto administrativo y desplegué Couchbase Server
    Enterprise 7.6.2 con cuatro Pods organizados en una topología MDS,
    utilizando PersistentVolumes respaldados por Amazon EBS gp3.

    Explica el propósito de cada comando, configuración o procedimiento,
    cómo interpretar las salidas esperadas, cómo validar que la tarea se
    completó correctamente y qué errores comunes podrían presentarse.

