# Prompts de apoyo para la Práctica 13
# El slug del laboratorio debe ser: lab13

tarea1:
  title: "Explicar la Tarea 1 con IA"
  prompt: >-
    Explícame expertamente qué hice en la Tarea 1 de la
    Práctica 13 de Couchbase Server.

    Establecí una línea base del clúster y del dataset, registré salud,
    membresía, servicios, versión y fingerprint de 100,000 documentos,
    y documenté una metodología de troubleshooting en seis etapas.

    Explica el propósito de cada comando, configuración o procedimiento,
    cómo interpretar las salidas esperadas, cómo validar que la tarea se
    completó correctamente y qué errores comunes podrían presentarse.

tarea2:
  title: "Explicar la Tarea 2 con IA"
  prompt: >-
    Explícame expertamente qué hice en la Tarea 2 de la
    Práctica 13 de Couchbase Server.

    Simulé presión de memoria reduciendo memoryQuota del bucket,
    correlacioné resident ratio, background fetches, memoria y colas
    con una sonda de lecturas y restauré posteriormente la cuota original.

    Explica el propósito de cada comando, configuración o procedimiento,
    cómo interpretar las salidas esperadas, cómo validar que la tarea se
    completó correctamente y qué errores comunes podrían presentarse.

tarea3:
  title: "Explicar la Tarea 3 con IA"
  prompt: >-
    Explícame expertamente qué hice en la Tarea 3 de la
    Práctica 13 de Couchbase Server.

    Creé un índice GSI con defer_build, confirmé su estado deferred,
    capturé el EXPLAIN previo, ejecuté BUILD INDEX y verifiqué que
    alcanzara online y fuera utilizado por el nuevo plan SQL++.

    Explica el propósito de cada comando, configuración o procedimiento,
    cómo interpretar las salidas esperadas, cómo validar que la tarea se
    completó correctamente y qué errores comunes podrían presentarse.

tarea4:
  title: "Explicar la Tarea 4 con IA"
  prompt: >-
    Explícame expertamente qué hice en la Tarea 4 de la
    Práctica 13 de Couchbase Server.

    Recolecté evidencia de Kubernetes, Couchbase y Operator mediante
    CouchbaseCluster YAML, Pods, PVC, eventos, logs y cbcollect_info,
    y empaqueté los principales archivos para diagnóstico y escalamiento.

    Explica el propósito de cada comando, configuración o procedimiento,
    cómo interpretar las salidas esperadas, cómo validar que la tarea se
    completó correctamente y qué errores comunes podrían presentarse.

tarea5:
  title: "Explicar la Tarea 5 con IA"
  prompt: >-
    Explícame expertamente qué hice en la Tarea 5 de la
    Práctica 13 de Couchbase Server.

    Capturé el fingerprint del restore point y creé un CouchbaseBackup
    immediate_full administrado por Operator sobre un PVC gp3,
    validando status, lastSuccess, repositorio, Job y almacenamiento.

    Explica el propósito de cada comando, configuración o procedimiento,
    cómo interpretar las salidas esperadas, cómo validar que la tarea se
    completó correctamente y qué errores comunes podrían presentarse.

tarea6:
  title: "Explicar la Tarea 6 con IA"
  prompt: >-
    Explícame expertamente qué hice en la Tarea 6 de la
    Práctica 13 de Couchbase Server.

    Generé 1,000 escrituras posteriores al backup, eliminé los datos
    de la collection y ejecuté un CouchbaseBackupRestore selectivo
    para recuperar únicamente el dataset protegido desde su restore point.

    Explica el propósito de cada comando, configuración o procedimiento,
    cómo interpretar las salidas esperadas, cómo validar que la tarea se
    completó correctamente y qué errores comunes podrían presentarse.

tarea7:
  title: "Explicar la Tarea 7 con IA"
  prompt: >-
    Explícame expertamente qué hice en la Tarea 7 de la
    Práctica 13 de Couchbase Server.

    Comparé fingerprints antes y después del restore, calculé writes
