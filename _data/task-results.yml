lab1:
  results:
    - "**Resultado esperado:** Herramientas locales, credenciales AWS y variables del laboratorio validadas correctamente antes de crear recursos en Amazon EKS."
    - "**Resultado esperado:** Script de ciclo de vida de Amazon EKS preparado y validado, identificando los componentes de infraestructura que serán aprovisionados mediante eksctl."
    - "**Resultado esperado:** Clúster Amazon EKS creado correctamente con tres nodos administrados en estado Ready y Amazon EBS CSI Driver disponible para almacenamiento persistente."
    - "**Resultado esperado:** StorageClass gp3 configurada con aprovisionamiento EBS dinámico y Couchbase Kubernetes Operator instalado junto con su Admission Controller."
    - "**Resultado esperado:** Couchbase Server Enterprise 7.6.2 desplegado mediante el Operator con cuatro Pods, topología MDS definida y almacenamiento persistente EBS correctamente enlazado."
    - "**Resultado esperado:** Topología MDS validada mediante Kubernetes y REST API, identificando dos nodos Data + Query, uno Index + Search y uno Analytics + Eventing."
    - "**Resultado esperado:** Bucket travel-sample instalado y disponible con más de 60 000 documentos, una réplica configurada y parámetros administrativos registrados mediante REST API."
    - "**Resultado esperado:** Cluster Map analizado correctamente, comprobando 1024 vBuckets activos y sus réplicas distribuidos exclusivamente entre los dos nodos Data."
    - "**Resultado esperado:** Arquitectura del clúster validada mediante Kubernetes, REST y SQL++, correlacionando servicios MDS, vBuckets, scopes, collections y consultas sobre travel-sample."
    - "**Resultado esperado:** Reporte automático de topología generado correctamente, consolidando nodos Kubernetes, servicios Couchbase, bucket, Cluster Map y distribución de vBuckets."
    - "**Resultado esperado:** Validación automática final completada con 20 comprobaciones exitosas y cero fallos, confirmando que la arquitectura alcanzó el estado previsto."


lab2:
  results:
    - "**Resultado esperado:** Topología de Couchbase, nodos Data, almacenamiento persistente y estado de los Pods validados antes de generar presión controlada sobre Data Service."
    - "**Resultado esperado:** Buckets lab-couchstore y lab-magma creados correctamente con sus respectivos storage engines, políticas de ejection, cuotas y una réplica configurada."
    - "**Resultado esperado:** Línea base de métricas capturada para ambos buckets, registrando memoria, resident ratio, ejection, elementos no residentes, background fetch y colas de persistencia."
    - "**Resultado esperado:** Presión de memoria generada sobre Couchstore hasta observar ejection y reducción de residencia sin provocar OOMKilled ni errores de memoria del contenedor."
    - "**Resultado esperado:** Magma sometido a carga progresiva y comparado operativamente con Couchstore, diferenciando fullEviction, valueOnly y sus patrones de residencia y recuperación."
    - "**Resultado esperado:** Carga mixta de lecturas y escrituras ejecutada mediante Couchbase Python SDK, permitiendo analizar cache misses, background fetch y lecturas de datos no residentes."
    - "**Resultado esperado:** Watermarks efectivos y Disk Write Queue analizados durante una ráfaga de escritura, correlacionando memoria, cola de persistencia y velocidad de drenado."
    - "**Resultado esperado:** Latencia de escritura medida para none, majority, majorityAndPersistActive y persistToMajority, comparando el costo relativo de cada nivel de Sync Durability."
    - "**Resultado esperado:** Métricas REST correlacionadas con Couchbase Web Console para ambos buckets, contrastando resident ratio, memoria, operaciones y comportamiento de persistencia."
    - "**Resultado esperado:** Evidencias consolidadas, métricas analizadas y recursos experimentales eliminados después de validar los objetivos funcionales alcanzados durante la práctica."

lab3:
  results:
    - "**Resultado esperado:** Query, Index y Data Service validados correctamente, confirmando la disponibilidad de los servicios y de los datos base requeridos para las consultas."
    - "**Resultado esperado:** Collection route_lab3 creada y poblada con al menos 500 000 documentos, utilizando airlineid válidos y comprobando relaciones correctas mediante JOIN."
    - "**Resultado esperado:** Plan baseline de Q1 capturado con EXPLAIN, identificando operadores, scans, filtros, estimaciones de costo y cardinalidad antes de aplicar optimizaciones."
    - "**Resultado esperado:** ADVISE, covering index y estadísticas del CBO aplicados correctamente, permitiendo comparar el plan inicial de Q1 con la estrategia seleccionada después de optimizar."
    - "**Resultado esperado:** Consultas con JOIN, GROUP BY, HAVING, UNNEST y subconsultas analizadas mediante EXPLAIN, relacionando índices, filtros y estructura documental con sus planes de ejecución."
    - "**Resultado esperado:** Ejecución real de Q1 y Q2 medida mediante PROFILE, identificando tiempos e intercambio de elementos por operador y diferenciando elapsedTime de executionTime."
    - "**Resultado esperado:** Prepared statement parametrizado creado y reutilizado correctamente, validando query context, parámetros nombrados y comparación de ejecuciones ad hoc frente a prepared."
    - "**Resultado esperado:** Timeout y max_parallelism aplicados por solicitud, comprobando mecanismos de protección y control de paralelismo sin modificar las sentencias SQL++ utilizadas."
    - "**Resultado esperado:** Carga concurrente ejecutada y correlacionada con Active Requests, Completed Requests y Query Monitor, registrando throughput, promedio y percentiles P50, P95 y P99."
    - "**Resultado esperado:** Validación final completada y recursos experimentales eliminados, conservando localmente planes, perfiles, benchmarks y demás evidencias generadas durante la práctica."

lab4:
  results:
    - "**Resultado esperado:** Topología con dos nodos Index validada y workload objetivo de 1 000 QPS analizado, priorizando los patrones de acceso que concentran mayor demanda."
    - "**Resultado esperado:** Collection booking_lab4 creada con 200 000 documentos reproducibles y baseline establecido mediante índice primario, planes EXPLAIN y métricas de Q1 a Q5."
    - "**Resultado esperado:** Índices simples y compuestos diseñados para Q1, Q2 y Q3, comprobando mediante EXPLAIN cambios en spans, acceso y cardinalidad estimada."
    - "**Resultado esperado:** Índice completo y partial index comparados mediante metadata, estadísticas y EXPLAIN, demostrando cómo el predicado parcial reduce las entradas mantenidas por GSI."
    - "**Resultado esperado:** Covering indexes creados para Q2 y Q4, verificando que los campos de filtro, orden y proyección permitan reducir o eliminar operaciones Fetch."
    - "**Resultado esperado:** Índice no particionado e índice HASH particionado comparados mediante metadata, placement, planes y métricas, relacionando particionamiento con distribución horizontal."
    - "**Resultado esperado:** Réplica GSI creada con num_replica=1 y continuidad de consultas validada durante la pérdida temporal y recreación automática de un Pod Index."
    - "**Resultado esperado:** Tres índices creados con defer_build y construidos mediante BUILD INDEX, observando su transición desde deferred hasta online de forma coordinada."
    - "**Resultado esperado:** Índice reconstruido mediante DROP, CREATE con defer_build y BUILD INDEX, comprobando posteriormente que vuelve a estar online y disponible para el optimizador."
    - "**Resultado esperado:** Inventario final y validación integral completados, eliminando booking_lab4 y el cliente temporal mientras se conservan planes, estadísticas, benchmarks y reportes."

lab5:
  results:
    - "**Resultado esperado:** Search, Eventing y Analytics validados correctamente dentro de la topología MDS, creando además el corpus bilingüe controlado requerido por las pruebas."
    - "**Resultado esperado:** Índice FTS scoped creado con mappings estáticos, analyzers en inglés y español, campos keyword y geopoint, confirmando la indexación completa del corpus."
    - "**Resultado esperado:** Consultas Search match, fuzzy, boolean y geo ejecutadas correctamente, comprobando análisis lingüístico, tolerancia a errores, filtros exactos y proximidad geográfica."
    - "**Resultado esperado:** Bucket y collections de Eventing preparados correctamente, separando source, destination y metadata e insertando mutaciones históricas previas al deployment."
    - "**Resultado esperado:** Función Eventing scoped desplegada con from_now, procesando nuevas mutaciones y generando documentos enriquecidos con duración, costo y categorías derivadas."
    - "**Resultado esperado:** Diferencia entre From Now y Everything validada mediante reprocesamiento histórico, métricas, application logs y eliminación sincronizada mediante OnDelete."
    - "**Resultado esperado:** Analytics habilitado sobre collections específicas y conteos analíticos comparados con Data Service, considerando la sincronización asíncrona mediante DCP."
    - "**Resultado esperado:** Consultas OLAP con RANK, COUNT, SUM y AVG mediante window functions ejecutadas sobre hoteles, reservas enriquecidas y rutas almacenadas en Analytics."
    - "**Resultado esperado:** Query Service y Analytics Service comparados mediante una consulta lógica equivalente, conservando planes y métricas sin asumir diferencias fijas de rendimiento."
    - "**Resultado esperado:** Validación integral y reporte final generados, retirando recursos temporales de Search, Eventing y Analytics sin modificar las collections originales de travel-sample."

lab6:
  results:
    - "**Resultado esperado:** Línea base de seguridad documentada, inventariando exposición Kubernetes, configuración inicial de transporte e identidades RBAC antes del hardening."
    - "**Resultado esperado:** Modelo RBAC granular implementado con grupos y cuentas de servicio separadas, validando permisos permitidos y denegados sobre datos, consultas e índices."
    - "**Resultado esperado:** CA privada, certificados X.509 de servidor y Operator y Kubernetes Secrets creados y verificados mediante cadena, SAN, propósito y fingerprints."
    - "**Resultado esperado:** Managed TLS habilitado declarativamente con TLS 1.2, client certificate authentication y nodeToNodeEncryption=All, validando Management y Query sobre HTTPS."
    - "**Resultado esperado:** Identidad mTLS de aplicación autenticada mediante certificado X.509 sin contraseña y asociada correctamente con un usuario RBAC mediante subject.cn."
    - "**Resultado esperado:** Auditoría habilitada con eventos descubiertos dinámicamente, rotación y retención configuradas y actividad de autenticación y Query generada para análisis."
    - "**Resultado esperado:** Audit logs recolectados desde todos los Pods Couchbase y consolidados localmente, permitiendo analizar eventos, identidades y nodo de origen."
    - "**Resultado esperado:** Hardening adicional validado sobre exposición Kubernetes, Managed TLS, cifrado interno, UI HTTP y controles productivos expresamente fuera de alcance."
    - "**Resultado esperado:** Matriz final de postura de seguridad documentada con evidencias de TLS, RBAC, mTLS, auditoría, cifrado entre nodos y protección de material sensible."
    - "**Resultado esperado:** Suite integral completada con cero fallos y reporte consolidado generado, preservando evidencias de seguridad antes de ejecutar la limpieza del entorno."

lab7:
  results:
    - "**Resultado esperado:** Workload empresarial caracterizado con 260 millones de documentos y 70,500 ops/s, separando valores documentados de Couchbase y supuestos del caso."
    - "**Resultado esperado:** RAM del Data Service calculada por bucket considerando metadata, réplicas, compresión, working set, overhead, high-water mark y headroom del escenario."
    - "**Resultado esperado:** Almacenamiento de Couchstore y Magma modelado mediante valores lógicos, tombstones, réplicas y factores de reserva explícitos, justificando el engine seleccionado."
    - "**Resultado esperado:** Query e Index Service dimensionados mediante concurrencia, CPU, entries, tamaño de claves, metadata Plasma, almacenamiento y working set de índices."
    - "**Resultado esperado:** Search, Analytics y Eventing dimensionados mediante drivers específicos, diferenciando valores documentados de los supuestos que requieren validación mediante benchmark."
    - "**Resultado esperado:** Tres escenarios MDS comparados por nodos, vCPU, RAM y almacenamiento, validando que el escenario objetivo soporte la demanda inicial incluso bajo condición N+1."
    - "**Resultado esperado:** Tres Availability Zones y tres Server Groups correlacionados con Pods y workers, diferenciando correctamente MDS, failure domains y réplicas de vBuckets."
    - "**Resultado esperado:** Crecimiento mensual y capacidad N+1 simulados para tres escenarios a 24 meses, identificando de forma pedagógica los puntos de presión de RAM y almacenamiento."
    - "**Resultado esperado:** Métricas reales del clúster reducido capturadas para residencia, background fetch, colas, memoria, documentos y consumo Kubernetes sin confundirlas con validación del sizing empresarial."
    - "**Resultado esperado:** Suite final completada y dossier de sizing generado con workload, RAM, disco, servicios, MDS, Server Groups, simulación, métricas y evidencias de validación."

lab8:
  results:
    - "**Resultado esperado:** Workload continuo 70/30 iniciado y línea base capturada con throughput, errores, percentiles, membership y helpers para descubrimiento y estabilidad."
    - "**Resultado esperado:** Scale-out declarativo de cuatro a cinco Data nodes completado mediante Operator, observando el ciclo de rebalance y manteniendo la carga activa durante la transición."
    - "**Resultado esperado:** Distribución de 1024 vBuckets analizada después del scale-out, identificando el nuevo Data Pod y capturando workload, métricas Couchbase y consumo Kubernetes."
    - "**Resultado esperado:** Scale-in declarativo de cinco a cuatro Data nodes completado sin ejectNode manual, verificando membership saludable y redistribución de active y replica vBuckets."
    - "**Resultado esperado:** SwapRebalance ejecutado mediante reschedule del Operator, reemplazando un Data Pod sin cambiar cardinalidad y manteniendo evidencia de UIDs y workload."
    - "**Resultado esperado:** Rebalance interrumpido deliberadamente mediante stopRebalance y posterior convergencia validada por reconciliación del Operator sin invocar rebalance manual ni recovery."
    - "**Resultado esperado:** Rebalance Retry nativo revisado y conservado deshabilitado, diferenciando su función de la reconciliación del Operator y de los mecanismos full o delta recovery."
    - "**Resultado esperado:** Scale-out y scale-in automatizados modificando únicamente CouchbaseCluster.spec y validando cardinalidad, salud y rebalance final sin operaciones manuales sobre nodos."
    - "**Resultado esperado:** Impacto operativo comparado mediante snapshots y log completo del workload, calculando throughput, errores y percentiles globales y por cada fase del laboratorio."
    - "**Resultado esperado:** Validación integral completada y reporte final generado con workload, fases, vBuckets, Rebalance Retry y estado final saludable del clúster."

lab9:
  results:
    - "**Resultado esperado:** Topología primaria validada con tres Availability Zones, tres Server Groups y distribución de active y replica vBuckets entre los Data nodes del clúster."
    - "**Resultado esperado:** Graceful failover ejecutado sobre un Data node mientras se mantiene un workload activo, registrando tiempo de operación, errores, latencia y recuperación posterior."
    - "**Resultado esperado:** Hard failover ejecutado tras la pérdida abrupta de un Data Pod, promoviendo réplicas disponibles y midiendo el impacto antes de restaurar la topología declarada."
    - "**Resultado esperado:** Auto-failover validado con timeout de 30 segundos, comprobando el incremento de su contador y diferenciando la protección intra-clúster de una conmutación hacia DR."
    - "**Resultado esperado:** XDCR A→B configurado declarativamente mediante Couchbase Kubernetes Operator con replicación filtrada exclusiva para documentos cuyo ID inicia con order::."
    - "**Resultado esperado:** Advanced Filtering validado en el clúster DR con documentos order::* replicados y documentos internal::* excluidos, complementando la prueba con métricas del pipeline XDCR."
    - "**Resultado esperado:** Conflict resolution comparado mediante buckets independientes seqno y lww con replicación bidireccional, confirmando convergencia de ambos clústeres a una versión final."
    - "**Resultado esperado:** Desastre del primario simulado y RPO experimental calculado a partir de escrituras confirmadas disponibles en DR, junto con el RTO de aplicación hacia Cluster B."
    - "**Resultado esperado:** Runbook de Disaster Recovery generado con objetivos y tiempos medidos, diferenciando mantenimiento planificado, fallo abrupto de nodo y desastre completo del sitio primario."
    - "**Resultado esperado:** Validación integral y reporte final completados con topología, failovers, XDCR filtering, conflictos, RPO, RTO y evidencias reproducibles del escenario de recuperación."

