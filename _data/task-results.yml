    - "**Resultado esperado:** Desastre del primario simulado y RPO experimental calculado a partir de escrituras confirmadas disponibles en DR, junto con el RTO de aplicación hacia Cluster B."
    - "**Resultado esperado:** Runbook de Disaster Recovery generado con objetivos y tiempos medidos, diferenciando mantenimiento planificado, fallo abrupto de nodo y desastre completo del sitio primario."
    - "**Resultado esperado:** Validación integral y reporte final completados con topología, failovers, XDCR filtering, conflictos, RPO, RTO y evidencias reproducibles del escenario de recuperación."

